<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Prédiction Résultat</title>
</head>
<body>
    <main>
        <p class="tag">MINI PROJET IA</p>
        <h1>Prédiction de la réussite d'un étudiant</h1>

        <p>Renseigner les heures et les notes</p>

        <form method="post" action="">
            <label for="heures">Nombre d'heures d'études</label>
            <input id="heures" type="number" name="heures_etudes"
                   max="10" min="0" required value="{{ heures }}">

            <label for="note">Note de l'étudiant</label>
            <input id="note" type="number" name="note_partiel"
                   max="10" min="0" required value="{{ note }}">

            <button type="submit">Prédire</button>
        </form>

        {% if erreur %}
            <p class="erreur" role="alert">{{ erreur }}</p>
        {% endif %}

        {% if resultat %}
            <section class="prediction" aria-live="polite">
                <p>Résultat</p>
                <h2>{{ resultat }}</h2>
            </section>
        {% endif %}
    </main>
</body>
</html>
